services:
  # Coordinator - discovers URLs and pushes to Kafka
  coordinator:
    build:
      context: .
      dockerfile: wsj/Dockerfile
    container_name: wsj-coordinator
    networks:
      - scraper-network
    environment:
      # Distributed options
      POD_INDEX: 0
      TOTAL_PODS: 4  # 1 coordinator + 3 workers
      DISTRIBUTION: kafka
      COORDINATOR_POD: 0
      KAFKA_URLS_TOPIC: wsj-urls
      KAFKA_URLS_GROUP: wsj-scraper-workers

      # Scraper options
      BASE_URL: https://www.wsj.com/world
      LIMIT: 30
      DELAY: 2.0
      VERBOSE: "true"
      HEADLESS: "true"

      # Kafka publishing (for scraped articles)
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: wsj-articles

      # Timezone
      TZ: UTC
    volumes:
      - ./images/coordinator:/app/data/images
    depends_on:
      kafka:
        condition: service_started

  # Worker 1
  worker1:
    build:
      context: .
      dockerfile: wsj/Dockerfile
    container_name: wsj-worker1
    environment:
      # Distributed options
      POD_INDEX: 1
      TOTAL_PODS: 4
      DISTRIBUTION: kafka
      KAFKA_URLS_TOPIC: wsj-urls
      KAFKA_URLS_GROUP: wsj-scraper-workers

      # Scraper options
      DELAY: 2.0
      VERBOSE: "true"
      HEADLESS: "true"

      # Kafka publishing (for scraped articles)
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: wsj-articles

      # Timezone
      TZ: UTC
    depends_on:
      kafka:
        condition: service_started
    networks:
      - scraper-network

  # Worker 2
  worker2:
    build:
      context: .
      dockerfile: wsj/Dockerfile
    container_name: wsj-worker2
    environment:
      # Distributed options
      POD_INDEX: 2
      TOTAL_PODS: 4
      DISTRIBUTION: kafka
      KAFKA_URLS_TOPIC: wsj-urls
      KAFKA_URLS_GROUP: wsj-scraper-workers

      # Scraper options
      DELAY: 2.0
      VERBOSE: "true"
      HEADLESS: "true"

      # Kafka publishing (for scraped articles)
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: wsj-articles

      # Timezone
      TZ: UTC
    depends_on:
      kafka:
        condition: service_started
    networks:
      - scraper-network

  # Worker 3
  worker3:
    build:
      context: .
      dockerfile: wsj/Dockerfile
    container_name: wsj-worker3
    environment:
      # Distributed options
      POD_INDEX: 3
      TOTAL_PODS: 4
      DISTRIBUTION: kafka
      KAFKA_URLS_TOPIC: wsj-urls
      KAFKA_URLS_GROUP: wsj-scraper-workers

      # Scraper options
      DELAY: 2.0
      VERBOSE: "true"
      HEADLESS: "true"

      # Kafka publishing (for scraped articles)
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: wsj-articles

      # Timezone
      TZ: UTC
    depends_on:
      kafka:
        condition: service_started
    networks:
      - scraper-network

  yfinance-scraper:
    build:
      context: .
      dockerfile: yfinance/Dockerfile
    container_name: yfinance-scraper
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped
    environment:
      # Preferred tickers
      - PREFERED_TICKERS_PATH=/app/top_stocks.txt
      # Kafka configuration
      - KAFKA_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=stock-updates
      # YFinance engine configuration
      - BATCH_SIZE=50
      - INTERVAL_MS=30000
      - INCLUDE_NEWS=true
      - ANALYZE_SENTIMENT=true
      - NEWS_DAYS=20
      - SENTIMENT_ANALYZER=keyword
      # Rate limiting and cooldown
      - COOLDOWN_PERIOD=60
      # OpenAI API key for LLM sentiment analysis (optional)
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Timezone
      - TZ=UTC
    volumes:
      # Mount custom preferred tickers list (optional)
      - ./yfinance/top_stocks.txt:/app/top_stocks.txt:ro
      # Mount Kafka config if using properties file (optional)
      # - ./kafka.properties:/app/kafka.properties:ro
    networks:
      - scraper-network

  seeking-alpha-scraper:
    build:
      context: .
      dockerfile: seeking-alpha/Dockerfile
    container_name: seeking-alpha-scraper
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped
    # Remove command to use entrypoint.sh with environment variables
    environment:
      # Scraper configuration
      - CATEGORY=market-news::us-economy
      - LIMIT=100
      - DELAY=2.0
      - CONTINUOUS=true
      - CONTINUOUS_INTERVAL=300
      - VERBOSE=true

      # Kafka configuration
      - KAFKA_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=seeking-alpha-news

      # Stealth mode and authentication
      - STEALTH_MODE=true
      - HEADLESS=true
      - SEEKING_ALPHA_EMAIL=XXXX
      - SEEKING_ALPHA_PASSWORD=YYYY

      # History configuration
      - HISTORY_FILE=/app/history/scraped_history.json
      - HISTORY_TTL_DAYS=30

      # Timezone
      - TZ=UTC
    volumes:
      # Persist scraping history
      - ./seeking-alpha/history:/app/history
      # Persist browser context for login sessions
      - ./seeking-alpha/chrome_seeking:/app/chrome_seeking
      # Mount Kafka config if using properties file (optional)
      # - ./kafka.properties:/app/kafka.properties:ro
    networks:
      - scraper-network

  investing-scraper:
    build:
      context: .
      dockerfile: investing/Dockerfile
    container_name: investing-scraper
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped
    environment:
      # Investing.com configuration
      - CATEGORY=economic-indicators
      - ANALYSIS=false  # Set to true to scrape from /analysis/ instead of /news/
      # Kafka configuration
      - KAFKA_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=investing-articles
      # Scraper settings
      - HEADLESS=true
      - LIMIT=50
      - DELAY=2.0
      - CONTINUOUS=true
      - CONTINUOUS_INTERVAL=300
      - VERBOSE=true
      # Timezone
      - TZ=UTC
    volumes:
      # Mount history directory for persistent de-duplication
      - ./investing/history:/app/history
      # Mount news directory if saving locally
      - ./investing/news:/app/news
    networks:
      - scraper-network

  twitter-scraper:
    build:
      context: .
      dockerfile: twitter/Dockerfile
    container_name: twitter-scraper
    depends_on:
      kafka:
        condition: service_started
    restart: unless-stopped
    environment:
      # What to scrape (set at least one of QUERIES / USERS).
      # NOTE: `$$` escapes `$` so compose doesn't treat cashtags as variable
      # substitutions — these reach the container as $TSLA,$NVDA,$AAPL.
      - TWITTER_QUERIES=$$TSLA,$$NVDA,$$AAPL
      - TWITTER_USERS=DeItaone,FirstSquawk
      - SEARCH_MODE=Latest
      - MAX_TWEETS=50
      - DELAY_MS=1500
      - CONTINUOUS=true
      - CONTINUOUS_INTERVAL=300
      - VERBOSE=true
      # Kafka configuration
      - KAFKA_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=twitter-tweets
      # Authentication (cookies strongly preferred over login).
      # Persist the cookies file under the mounted history volume.
      - TWITTER_COOKIES_FILE=/app/history/cookies.json
      # - TWITTER_USERNAME=
      # - TWITTER_PASSWORD=
      # - TWITTER_EMAIL=
      # History configuration
      - HISTORY_FILE=/app/history/scraped_history.json
      - HISTORY_TTL_DAYS=30
      # Timezone
      - TZ=UTC
    volumes:
      # Persist scraping history + cookies session
      - ./twitter/history:/app/history
    networks:
      - scraper-network

  kafka:
    image: confluentinc/cp-server:8.2.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    networks:
      - scraper-network
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_METRIC_REPORTERS: io.confluent.telemetry.reporter.TelemetryReporter
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CONFLUENT_METRICS_ENABLE: 'false'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_ENABLED: "false"
      KAFKA_CONFLUENT_TELEMETRY_REMOTECONFIG_CONFLUENT_ENABLED: "false"
      KAFKA_CONFLUENT_CONSUMER_LAG_EMITTER_ENABLED: "false"

networks:
  scraper-network:
    driver: bridge
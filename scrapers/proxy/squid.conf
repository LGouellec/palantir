# Ports :
# - 3128 : proxy HTTP explicite
# - 443  : proxy HTTPS explicite (CONNECT) avec TLS côté client
http_port 3128
# https_port 443 cert=/etc/letsencrypt/live/proxy.example.com/fullchain.pem key=/etc/letsencrypt/live/proxy.example.com/privkey.pem

# Logs
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log

# Politique d'accès :
# - autoriser réseau local + authentifiés
# - refuser le reste
http_access allow all

# DNS
dns_v4_first on

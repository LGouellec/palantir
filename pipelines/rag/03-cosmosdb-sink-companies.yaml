---
# Connector config object (the body for PUT /connectors/{name}/config — bare
# config, no {name,config} wrapper). The connector name is set by the Job below.
# connect.cosmos.master.key is left as the token __MASTER_KEY__ and substituted
# from the Secret by the Job, so the real key never lands in this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cosmosdb-sink-companies-config
  namespace: palantir-rag
data:
  connector.json: |
    {
      "connector.class": "com.azure.cosmos.kafka.connect.sink.CosmosDBSinkConnector",
      "tasks.max": "3",
      "topics": "companies",
      "connect.cosmos.connection.endpoint": "https://palantir-rag.documents.azure.com:443/",
      "connect.cosmos.master.key": "__MASTER_KEY__",
      "connect.cosmos.databasename": "palantir-db",
      "connect.cosmos.containers.topicmap": "companies#companies",
      "connect.cosmos.sink.bulk.enabled": "false",
      "connect.cosmos.connection.gateway.enabled": "false",
      "id.strategy": "com.azure.cosmos.kafka.connect.sink.id.strategy.FullKeyStrategy",
      "transforms": "extractKey,keyToValue",
      "transforms.extractKey.type": "org.apache.kafka.connect.transforms.ExtractField$Key",
      "transforms.extractKey.field": "ticker",
      "transforms.keyToValue.type": "com.clickhouse.kafka.connect.transforms.KeyToValue",
      "transforms.keyToValue.field": "ticker"
    }
---
# One-shot Job that waits for the Connect REST API + the CosmosDB plugin to be
# loaded, substitutes the master key into the connector JSON, then registers it
# with an idempotent PUT /connectors/{name}/config (create-or-update, a single
# rebalance, no DELETE). Retries on HTTP 409 ("conflicting operation / worker
# rebalance") which is expected while a multi-worker cluster is rebalancing.
apiVersion: batch/v1
kind: Job
metadata:
  name: register-cosmosdb-sink-companies
  namespace: palantir-rag
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: register-cosmosdb-sink-companies
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: curlimages/curl:8.10.1
          env:
            - name: COSMOS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: cosmosdb-credentials
                  key: master-key
          command:
            - sh
            - -c
            - |
              set -e
              CONNECT=http://kafka-connect.palantir-rag.svc.cluster.local:8083
              NAME=palantir-cosmos-sink-companies

              echo "Waiting for Kafka Connect REST API + CosmosDB plugin to load..."
              until curl -sf "$CONNECT/connector-plugins" | grep -q "CosmosDBSinkConnector"; do
                echo "  ...not ready yet"; sleep 10;
              done

              # Substitute the secret into the connector config object.
              sed "s#__MASTER_KEY__#${COSMOS_MASTER_KEY}#" /config/connector.json > /tmp/connector.json

              # Idempotent create-or-update. PUT triggers a single rebalance and
              # returns 409 if the cluster is mid-rebalance — so retry until 2xx.
              echo "Registering connector '$NAME' (PUT config, retry on 409)..."
              for attempt in $(seq 1 30); do
                CODE=$(curl -s -o /tmp/resp -w '%{http_code}' \
                  -X PUT "$CONNECT/connectors/$NAME/config" \
                  -H "Content-Type: application/json" \
                  --data @/tmp/connector.json)
                echo "  attempt $attempt -> HTTP $CODE"
                case "$CODE" in
                  2*) echo "Registered."; cat /tmp/resp; break ;;
                  409) echo "  cluster rebalancing, retrying..."; sleep 10 ;;
                  *)  echo "Registration failed (HTTP $CODE):"; cat /tmp/resp; exit 1 ;;
                esac
                if [ "$attempt" = "30" ]; then echo "Gave up after 30 attempts."; exit 1; fi
              done

              echo ""
              echo "Connector status:"
              curl -sf "$CONNECT/connectors/$NAME/status"
          volumeMounts:
            - name: connector-config
              mountPath: /config
      volumes:
        - name: connector-config
          configMap:
            name: cosmosdb-sink-companies-config

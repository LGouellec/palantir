---
# CRD: MarketShardConfig
# The desired sharding of the US equity universe across Longbridge workers.
# spec.symbols / spec.symbolsHash are (re)written daily by the refresh CronJob.
# status.* is written by the operator after each reconciliation.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: marketshardconfigs.trading.palantir.io
spec:
  group: trading.palantir.io
  scope: Namespaced
  names:
    kind: MarketShardConfig
    plural: marketshardconfigs
    singular: marketshardconfig
    shortNames:
      - msc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                maxPerShard:
                  type: integer
                  default: 500
                  minimum: 1
                  maximum: 500
                  description: Max tickers per WebSocket/account (Longbridge limit is 500).
                exchanges:
                  type: array
                  items:
                    type: string
                  default: ["NASDAQ", "NYSE"]
                includeEtf:
                  type: boolean
                  default: true
                symbols:
                  type: array
                  items:
                    type: string
                  description: Full ordered list of Longbridge symbols (e.g. AAPL.US).
                symbolsHash:
                  type: string
                  description: Content hash of the symbol list; changes trigger a rollout.
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Symbols
          type: integer
          jsonPath: .status.symbolCount
        - name: Shards
          type: integer
          jsonPath: .status.shardCount
        - name: Hash
          type: string
          jsonPath: .status.observedHash
        - name: LastReconcile
          type: string
          jsonPath: .status.lastReconcile

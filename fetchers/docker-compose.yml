# Local smoke test for the fetchers (no Kubernetes). A single Kafka broker is
# shared by every fetcher; bring up only the one you need:
#
#   # Alpaca real-time news -> news.realtime
#   export APCA_API_KEY_ID=... APCA_API_SECRET_KEY=...
#   export NEWS_SYMBOLS="AAPL,MSFT,TSLA"        # optional, default "*" = all
#   docker compose up --build kafka alpaca-news
#
#   # Longbridge real-time quotes/depth -> quotes.realtime / quotes.depth
#   echo '["AAPL.US","MSFT.US","TSLA.US"]' > ./longbridge/local/us-equities.json
#   export LONGPORT_APP_KEY=... LONGPORT_APP_SECRET=... LONGPORT_ACCESS_TOKEN=...
#   docker compose up --build kafka longbridge-shard
services:

  kafka:
    image: confluentinc/cp-server:8.2.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_METRIC_REPORTERS: io.confluent.telemetry.reporter.TelemetryReporter
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CONFLUENT_METRICS_ENABLE: 'false'
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_ENABLED: "false"
      KAFKA_CONFLUENT_TELEMETRY_REMOTECONFIG_CONFLUENT_ENABLED: "false"
      KAFKA_CONFLUENT_CONSUMER_LAG_EMITTER_ENABLED: "false"

  # Alpaca real-time news fetcher (single WebSocket, all symbols via "*").
  alpaca-news:
    build:
      context: ./alpaca
      dockerfile: worker/Dockerfile
    environment:
      NEWS_SYMBOLS: ${NEWS_SYMBOLS:-*}
      NEWS_TOPIC: ${NEWS_TOPIC:-news.realtime}
      INCLUDE_CONTENT: ${INCLUDE_CONTENT:-true}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      APCA_API_KEY_ID: ${APCA_API_KEY_ID}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY}
    depends_on:
      - kafka

  # Longbridge single-shard quote/depth fetcher (falls back to a shared account).
  longbridge-shard:
    build:
      context: ./longbridge
      dockerfile: worker/Dockerfile
    environment:
      SHARD_INDEX: "0"
      SHARD_COUNT: "1"
      MAX_PER_SHARD: "500"
      SYMBOLS_PATH: /config/us-equities.json
      SUBSCRIBE_QUOTE: "true"
      SUBSCRIBE_DEPTH: "true"
      QUOTE_TOPIC: quotes.realtime
      DEPTH_TOPIC: quotes.depth
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      LONGPORT_APP_KEY: ${LONGPORT_APP_KEY}
      LONGPORT_APP_SECRET: ${LONGPORT_APP_SECRET}
      LONGPORT_ACCESS_TOKEN: ${LONGPORT_ACCESS_TOKEN}
    volumes:
      - ./longbridge/local:/config:ro
    depends_on:
      - kafka

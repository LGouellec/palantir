name: Trading Agent Build and Push to Azure ACR

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  ACR_NAME: palantiracr
  IMAGE_AGENT_NAME: palantir/trading-agent
  CONTEXT_PATH: ./agent
  DOCKERFILE_AGENT_PATH: ./agent/Dockerfile

jobs:
  build-and-push-acr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
      # Fail fast: catch broken imports/syntax before spending time on the multi-arch build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sanity check agent modules
        working-directory: ${{ env.CONTEXT_PATH }}
        run: |
          pip install --no-cache-dir -r requirements.txt
          python -c "import config, credentials, trade_signal, risk, rules, alpaca_trading, kafka_consumer, runner"
      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Generate tags
      - name: Generate tags
        id: generate-tags
        run: |
          ACR_REGISTRY="${{ env.ACR_NAME }}.azurecr.io"
          IMAGE_AGENT="${ACR_REGISTRY}/${{ env.IMAGE_AGENT_NAME }}"

          TAGS_AGENT="${IMAGE_AGENT}:latest"

          # Add branch name tag
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            TAGS_AGENT="${TAGS_AGENT},${IMAGE_AGENT}:${BRANCH_NAME}"
          fi

          # Add semver tags for releases
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAGS_AGENT="${TAGS_AGENT},${IMAGE_AGENT}:${VERSION}"
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f1-2)
            TAGS_AGENT="${TAGS_AGENT},${IMAGE_AGENT}:${MAJOR},${IMAGE_AGENT}:${MINOR}"
          fi

          # Add SHA tag
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAGS_AGENT="${TAGS_AGENT},${IMAGE_AGENT}:sha-${SHORT_SHA}"

          echo "tags_agent=${TAGS_AGENT}" >> $GITHUB_OUTPUT
          echo "Generated tags agent: ${TAGS_AGENT}"
      # Login Docker registry
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: "${{ env.ACR_NAME }}.azurecr.io"
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      # Build and push Docker image
      - name: Build and push Trading Agent Docker image to ACR
        id: build-and-push-agent
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_AGENT_PATH }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.generate-tags.outputs.tags_agent }}
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_AGENT_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_AGENT_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
      # Summary
      - name: Create job summary
        if: always()
        run: |
          echo "## Azure ACR Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.ACR_NAME }}.azurecr.io\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Built" >> $GITHUB_STEP_SUMMARY
          echo "1. **Trading Agent:** \`${{ env.IMAGE_AGENT_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.generate-tags.outputs.tags_agent }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Digest" >> $GITHUB_STEP_SUMMARY
          echo "- **Trading Agent:** \`${{ steps.build-and-push-agent.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

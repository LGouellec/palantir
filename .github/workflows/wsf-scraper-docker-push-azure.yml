name: Docker Build and Push to Azure ACR

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  ACR_NAME: palantiracr
  IMAGE_NAME: wsj-scraper
  DOCKERFILE_PATH: ./Dockerfile

jobs:
  build-and-push-acr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Generate tags
      - name: Generate tags
        id: generate-tags
        run: |
          ACR_REGISTRY="${{ env.ACR_NAME }}.azurecr.io"
          IMAGE="${ACR_REGISTRY}/${{ env.IMAGE_NAME }}"

          TAGS="${IMAGE}:latest"

          # Add branch name tag
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            TAGS="${TAGS},${IMAGE}:${BRANCH_NAME}"
          fi

          # Add semver tags for releases
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAGS="${TAGS},${IMAGE}:${VERSION}"
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f1-2)
            TAGS="${TAGS},${IMAGE}:${MAJOR},${IMAGE}:${MINOR}"
          fi

          # Add SHA tag
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAGS="${TAGS},${IMAGE}:sha-${SHORT_SHA}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "Generated tags: ${TAGS}"
      # Login Docker registry
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: "${{ env.ACR_NAME }}.azurecr.io"
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      # Build and push Docker image
      - name: Build and push Docker image to ACR
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./scrapers/wsj
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.generate-tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
      # Summary
      - name: Create job summary
        if: always()
        run: |
          echo "## Azure ACR Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.ACR_NAME }}.azurecr.io\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.generate-tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-and-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
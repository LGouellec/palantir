name: Docker Build and Push to Azure ACR

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  ACR_NAME: palantiracr
  IMAGE_WSJ_NAME: palantir/wsj-scraper
  IMAGE_YFINANCE_NAME: palantir/yfinance-scraper
  IMAGE_SEEKING_NAME: palantir/seeking-scraper
  CONTEXT_PATH: ./scrapers
  DOCKERFILE_WSJ_PATH: ./scrapers/wsj/Dockerfile
  DOCKERFILE_YF_PATH: ./scrapers/yfinance/Dockerfile
  DOCKERFILE_SEEKING_PATH: ./scrapers/seeking-alpha/Dockerfile

jobs:
  build-and-push-acr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Generate tags
      - name: Generate tags
        id: generate-tags
        run: |
          ACR_REGISTRY="${{ env.ACR_NAME }}.azurecr.io"
          IMAGE_WSJ="${ACR_REGISTRY}/${{ env.IMAGE_WSJ_NAME }}"
          IMAGE_YF="${ACR_REGISTRY}/${{ env.IMAGE_YFINANCE_NAME }}"
          IMAGE_SEEKING="${ACR_REGISTRY}/${{ env.IMAGE_SEEKING_NAME }}"

          TAGS_WSJ="${IMAGE_WSJ}:latest"
          TAGS_YF="${IMAGE_YF}:latest"
          TAGS_SEEKING="${IMAGE_SEEKING}:latest"

          # Add branch name tag
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            TAGS_WSJ="${TAGS_WSJ},${IMAGE_WSJ}:${BRANCH_NAME}"
            TAGS_YF="${TAGS_YF},${IMAGE_YF}:${BRANCH_NAME}"
            TAGS_SEEKING="${TAGS_SEEKING},${IMAGE_SEEKING}:${BRANCH_NAME}"
          fi

          # Add semver tags for releases
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAGS_WSJ="${TAGS_WSJ},${IMAGE_WSJ}:${VERSION}"
            TAGS_YF="${TAGS_YF},${IMAGE_YF}:${VERSION}"
            TAGS_SEEKING="${TAGS_SEEKING},${IMAGE_SEEKING}:${VERSION}"
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f1-2)
            TAGS_WSJ="${TAGS_WSJ},${IMAGE_WSJ}:${MAJOR},${IMAGE_WSJ}:${MINOR}"
            TAGS_YF="${TAGS_YF},${IMAGE_YF}:${MAJOR},${IMAGE_YF}:${MINOR}"
            TAGS_SEEKING="${TAGS_SEEKING},${IMAGE_SEEKING}:${MAJOR},${IMAGE_SEEKING}:${MINOR}"
          fi

          # Add SHA tag
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAGS_WSJ="${TAGS_WSJ},${IMAGE_WSJ}:sha-${SHORT_SHA}"
          TAGS_YF="${TAGS_YF},${IMAGE_YF}:sha-${SHORT_SHA}"
          TAGS_SEEKING="${TAGS_SEEKING},${IMAGE_SEEKING}:sha-${SHORT_SHA}"

          echo "tags_wsj=${TAGS_WSJ}" >> $GITHUB_OUTPUT
          echo "tags_yfinance=${TAGS_YF}" >> $GITHUB_OUTPUT
          echo "tags_seeking=${TAGS_SEEKING}" >> $GITHUB_OUTPUT
          echo "Generated tags wsj: ${TAGS_WSJ}"
          echo "Generated tags yfinance: ${TAGS_YF}"
          echo "Generated tags seeking: ${TAGS_SEEKING}"
      # Login Docker registry
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: "${{ env.ACR_NAME }}.azurecr.io"
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      # Build and push Docker image WSJ
      - name: Build and push WSJ Docker image to ACR
        id: build-and-push-wsj
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_WSJ_PATH }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.generate-tags.outputs.tags_wsj }}
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_WSJ_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_WSJ_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
      # Build and push Docker image YFinance
      - name: Build and push YFinance Docker image to ACR
        id: build-and-push-yf
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_YF_PATH }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.generate-tags.outputs.tags_yfinance }}
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_YFINANCE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_YFINANCE_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
      # Build and push Docker image Seeking Alpha
      - name: Build and push Seeking Alpha Docker image to ACR
        id: build-and-push-seeking
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_SEEKING_PATH }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.generate-tags.outputs.tags_seeking }}
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_SEEKING_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_SEEKING_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
      # Summary
      - name: Create job summary
        if: always()
        run: |
          echo "## Azure ACR Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.ACR_NAME }}.azurecr.io\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Built" >> $GITHUB_STEP_SUMMARY
          echo "1. **WSJ Scraper:** \`${{ env.IMAGE_WSJ_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "2. **YFinance Scraper:** \`${{ env.IMAGE_YFINANCE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "3. **Seeking Alpha Scraper:** \`${{ env.IMAGE_SEEKING_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "**WSJ Scraper:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.generate-tags.outputs.tags_wsj }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**YFinance Scraper:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.generate-tags.outputs.tags_yfinance }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Seeking Alpha Scraper:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.generate-tags.outputs.tags_seeking }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Digests" >> $GITHUB_STEP_SUMMARY
          echo "- **WSJ:** \`${{ steps.build-and-push-wsj.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **YFinance:** \`${{ steps.build-and-push-yf.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Seeking Alpha:** \`${{ steps.build-and-push-seeking.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
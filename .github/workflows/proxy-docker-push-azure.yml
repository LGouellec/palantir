name: Flink Proxy Build and Push to Azure ACR

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  ACR_NAME: palantiracr
  IMAGE_PROXY_NAME: palantir/company-flink-proxy
  CONTEXT_PATH: ./proxy
  DOCKERFILE_PROXY_PATH: ./proxy/Dockerfile

jobs:
  build-and-push-acr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
      # Verify the project compiles before building the image (fail fast)
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (Release)
        working-directory: ${{ env.CONTEXT_PATH }}
        run: dotnet build proxy.csproj -c Release
      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Generate tags
      - name: Generate tags
        id: generate-tags
        run: |
          ACR_REGISTRY="${{ env.ACR_NAME }}.azurecr.io"
          IMAGE_PROXY="${ACR_REGISTRY}/${{ env.IMAGE_PROXY_NAME }}"

          TAGS_PROXY="${IMAGE_PROXY}:latest"

          # Add branch name tag
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            TAGS_PROXY="${TAGS_PROXY},${IMAGE_PROXY}:${BRANCH_NAME}"
          fi

          # Add semver tags for releases
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAGS_PROXY="${TAGS_PROXY},${IMAGE_PROXY}:${VERSION}"
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f1-2)
            TAGS_PROXY="${TAGS_PROXY},${IMAGE_PROXY}:${MAJOR},${IMAGE_PROXY}:${MINOR}"
          fi

          # Add SHA tag
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAGS_PROXY="${TAGS_PROXY},${IMAGE_PROXY}:sha-${SHORT_SHA}"

          echo "tags_proxy=${TAGS_PROXY}" >> $GITHUB_OUTPUT
          echo "Generated tags proxy: ${TAGS_PROXY}"
      # Login Docker registry
      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: "${{ env.ACR_NAME }}.azurecr.io"
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      # Build and push Docker image
      - name: Build and push Flink Proxy Docker image to ACR
        id: build-and-push-proxy
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_PROXY_PATH }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.generate-tags.outputs.tags_proxy }}
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_PROXY_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_PROXY_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
      # Summary
      - name: Create job summary
        if: always()
        run: |
          echo "## Azure ACR Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`${{ env.ACR_NAME }}.azurecr.io\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Built" >> $GITHUB_STEP_SUMMARY
          echo "1. **Flink Proxy:** \`${{ env.IMAGE_PROXY_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.generate-tags.outputs.tags_proxy }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Digest" >> $GITHUB_STEP_SUMMARY
          echo "- **Flink Proxy:** \`${{ steps.build-and-push-proxy.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
